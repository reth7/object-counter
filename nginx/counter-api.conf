# Add inside your existing console.vrishabhindustries.in server{} block,
# or as a subdomain (counter.vrishabhindustries.in) with its own cert.

location /counter-api/ {
    client_max_body_size 25m;

    # strip prefix: /counter-api/v1/count -> /v1/count
    rewrite ^/counter-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8090;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # nginx-level rate limit (defense in depth, define zone in http{}):
    # limit_req zone=counterzone burst=10 nodelay;
}

# In the http{} block of nginx.conf:
# limit_req_zone $binary_remote_addr zone=counterzone:10m rate=30r/m;
